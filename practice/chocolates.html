<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box of Chocolates</title>

<style>
    body {
        background: linear-gradient(135deg, #1a2980, #26d0ce);
        min-height: 100vh;
        font-family: Tahoma, sans-serif;
    }

    h1 {
        text-align: center;
        color: white;
    }

    .container {
        display: grid;
        width: 80vw;
        min-height: 80vh;
        margin: auto;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 10px;
        background-color: thistle;
        padding: 10px;
        border-radius: 20px;
        border: 8px solid red;
    }

    .heart {
        width: 80%;
        height: 20vh;
        margin: auto;
        background-color: chocolate;
        clip-path: polygon(
            50% 15%, 65% 0%, 85% 0%,
            100% 20%, 100% 45%,
            50% 100%, 0% 45%,
            0% 20%, 15% 0%, 35% 0%
        );
    }

    #chocolateheart {
        grid-column: 3;
        grid-row: 2;
    }

    .lilbits {
        grid-column: 1;
        grid-row: 1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 5px;
    }

    .mnm {
        width: 60px;
        height: 60px;
        background-color: red;
        border-radius: 50%;
        margin: auto;
        display: grid;
        place-items: center;
        font-size: 2em;
        color: white;
        font-weight: bold;
    }

    .mnm:nth-child(2) {
        background-color: blue;
    }

    .mnm:nth-child(3) {
        background-color: green;
    }

    .mnm:nth-child(4) {
        background-color: orange;
    }

    .mnm:nth-child(5) {
        background-color: purple;
    }

    .mnm:nth-child(6) {
        background-color: brown;
    }

    .chocolate {
        background-color: saddlebrown;
        border-radius: 15px;
        display: grid;
        place-items: center;
        font-size: 3em;
        margin: 10px;
        border: 4px solid #5c2e0b;
    }

    .big-bar {
        grid-column: 1 / 3;
        grid-row: 2;
        background-color: #6b3516;
        border: 6px solid #3e1f0d;
        border-radius: 12px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        padding: 10px;
    }

    .piece {
        background-color: #a0522d;
        border: 3px solid #4b2410;
        border-radius: 5px;
        display: grid;
        place-items: center;
        color: white;
        font-size: 1.5em;
    }

    .circle {
        background-color: chocolate;
        border-radius: 50%;
        width: 70px;
        height: 70px;
        margin: auto;
    }

    .square {
        background-color: sienna;
        width: 70px;
        height: 70px;
        margin: auto;
        border-radius: 10px;
    }

    .diamond {
        background-color: peru;
        width: 65px;
        height: 65px;
        margin: auto;
        transform: rotate(45deg);
    }

    .truffles {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        place-items: center;
    }

    .candy {
        width: 65px;
        height: 65px;
        background-color: #8b4513;
        border-radius: 50%;
        border: 5px dotted #deb887;
    }

    .white-chocolate {
        background-color: #f5deb3;
        border: 5px solid #d2b48c;
        border-radius: 20px;
        display: grid;
        place-items: center;
        font-size: 2em;
        color: #5c3317;
    }

    .dark-chocolate {
        background-color: #3b1f16;
        border: 5px solid #24110c;
        border-radius: 20px;
        display: grid;
        place-items: center;
        font-size: 2em;
        color: white;
    }
</style>
</head>

<body>

<h1>Here, I got you some chocolates &lt;3</h1>

<div class="container">

    <!-- Colorful M&Ms -->
    <div class="lilbits">
        <div class="mnm">M</div>
        <div class="mnm">M</div>
        <div class="mnm">M</div>
        <div class="mnm">M</div>
        <div class="mnm">M</div>
        <div class="mnm">M</div>
    </div>

    <!-- Chocolate pieces -->
    <div class="chocolate">
        <div class="circle"></div>
    </div>

    <div class="chocolate">
        <div class="square"></div>
    </div>

    <!-- Large chocolate bar -->
    <div class="big-bar">
        <div class="piece">1</div>
        <div class="piece">2</div>
        <div class="piece">3</div>
        <div class="piece">4</div>
        <div class="piece">5</div>
        <div class="piece">6</div>
        <div class="piece">7</div>
        <div class="piece">8</div>
    </div>

    <!-- Chocolate heart -->
    <div class="heart" id="chocolateheart"></div>

    <!-- Diamond chocolate -->
    <div class="chocolate">
        <div class="diamond"></div>
    </div>

    <!-- Chocolate truffles -->
    <div class="truffles">
        <div class="candy"></div>
        <div class="candy"></div>
        <div class="candy"></div>
        <div class="candy"></div>
    </div>

    <!-- White chocolate -->
    <div class="white-chocolate">
        White Chocolate
    </div>

    <!-- Dark chocolate -->
    <div class="dark-chocolate">
        Dark Chocolate
    </div>

</div>

</body>
</html>
